[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/var/lib/microtensor-miner/supervisord.pid
childlogdir=/var/log/microtensor-miner
umask=077

[program:microtensor-upstream]
command=/workspace/microtensor-miner/.venv/bin/python -m microtensor_miner_controller.upstream_observer --repo /var/lib/microtensor-miner/upstream-checkout --state-dir /var/lib/microtensor-miner/upstream-observer --poll-seconds 300
directory=/var/lib/microtensor-miner
user=microtensor
environment=HOME="/var/lib/microtensor-miner",USER="microtensor",LOGNAME="microtensor",XDG_CACHE_HOME="/var/cache/microtensor-miner",TMPDIR="/var/lib/microtensor-miner/tmp",PYTHONSAFEPATH="1",PYTHONDONTWRITEBYTECODE="1"
umask=0077
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:microtensor-code-rank]
command=/workspace/microtensor-miner/.venv/bin/python -m microtensor_miner_controller.rank_observer --track code --hardware-class mt-3g --hotkey 5HgeNAYMw7piRNCNgGuRyaDnJUsoazZpxEbT7G7RukHSNw3r --state-dir /var/lib/microtensor-miner/code-rank --poll-seconds 300
directory=/var/lib/microtensor-miner
user=microtensor
environment=HOME="/var/lib/microtensor-miner",USER="microtensor",LOGNAME="microtensor",XDG_CACHE_HOME="/var/cache/microtensor-miner",TMPDIR="/var/lib/microtensor-miner/tmp",PYTHONSAFEPATH="1",PYTHONDONTWRITEBYTECODE="1"
umask=0077
priority=15
autostart=true
autorestart=true
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:microtensor-miner]
command=/workspace/microtensor-miner/scripts/run-controller.sh
directory=/var/lib/microtensor-miner
user=microtensor
environment=MMC_ENV_FILE="/etc/microtensor-miner/miner.env",HOME="/var/lib/microtensor-miner",USER="microtensor",LOGNAME="microtensor",XDG_CACHE_HOME="/var/cache/microtensor-miner",TMPDIR="/var/lib/microtensor-miner/tmp",PYTHONSAFEPATH="1",PYTHONDONTWRITEBYTECODE="1"
umask=0077
priority=20
# Keep this program stopped until the launch rehearsal in launch_todo.md passes.
autostart=false
autorestart=unexpected
# Exit 3 is a persistent transaction-authorization stop that requires operator review.
# Exit 2 is a refusal that --once reports; the continuous `run` retries in process instead.
exitcodes=0,3
startsecs=0
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
