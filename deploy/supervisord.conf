[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/workspace/microtensor-miner/runtime/supervisord.pid
childlogdir=/workspace/microtensor-miner/runtime
umask=077

[program:microtensor-upstream]
command=/workspace/microtensor-miner/.venv/bin/python -m microtensor_miner_controller.upstream_observer --repo /workspace/microtensor-subnet --state-dir /workspace/microtensor-miner/runtime/upstream-observer --poll-seconds 300
directory=/workspace/microtensor-miner
user=microtensor
environment=PYTHONDONTWRITEBYTECODE="1",PYTHONSAFEPATH="1"
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:microtensor-miner]
command=/workspace/microtensor-miner/scripts/run-controller.sh
directory=/workspace/microtensor-miner
user=microtensor
environment=MMC_ENV_FILE="/workspace/microtensor-miner/runtime/miner.env",PYTHONDONTWRITEBYTECODE="1",PYTHONSAFEPATH="1"
priority=20
autostart=true
autorestart=unexpected
# Exit 3 is a persistent transaction-authorization stop that requires operator review.
exitcodes=0,3
startsecs=0
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
