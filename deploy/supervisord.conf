[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/workspace/microtensor-miner/runtime/supervisord.pid
childlogdir=/workspace/microtensor-miner/runtime
umask=077

[program:microtensor-miner]
command=/workspace/microtensor-miner/scripts/run-controller.sh
directory=/workspace/microtensor-miner
user=microtensor
environment=MMC_ENV_FILE="/workspace/microtensor-miner/runtime/miner.env"
autostart=true
autorestart=true
exitcodes=0
startsecs=0
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
