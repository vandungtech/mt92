[program:microtensor-code-rank]
command=/workspace/microtensor-miner/.venv/bin/python -m microtensor_miner_controller.rank_observer --track code --hardware-class mt-3g --hotkey 5HgeNAYMw7piRNCNgGuRyaDnJUsoazZpxEbT7G7RukHSNw3r --state-dir /workspace/microtensor-miner/runtime/code-rank --poll-seconds 300
directory=/workspace/microtensor-miner
user=root
autostart=true
autorestart=true
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspace/microtensor-miner/runtime/code-rank.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
