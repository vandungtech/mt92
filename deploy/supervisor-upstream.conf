[program:microtensor-upstream]
command=/workspace/microtensor-miner/.venv/bin/python -m microtensor_miner_controller.upstream_observer --repo /workspace/microtensor-subnet --state-dir /workspace/microtensor-miner/runtime/upstream-observer --poll-seconds 300
directory=/workspace/microtensor-miner
user=root
environment=PYTHONDONTWRITEBYTECODE="1",PYTHONSAFEPATH="1"
umask=0077
autostart=true
autorestart=true
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspace/microtensor-miner/runtime/upstream-observer.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
