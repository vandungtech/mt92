[program:microtensor-miner]
command=/workspace/microtensor-miner/scripts/run-controller.sh
directory=/workspace/microtensor-miner
user=root
environment=MMC_ENV_FILE="/workspace/microtensor-miner/runtime/miner.env"
autostart=true
autorestart=unexpected
# Exit 3 is a persistent transaction-authorization stop that requires operator review.
exitcodes=0,3
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/workspace/microtensor-miner/runtime/controller.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
