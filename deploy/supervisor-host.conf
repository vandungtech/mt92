[program:microtensor-miner]
command=/workspace/microtensor-miner/scripts/run-controller.sh
directory=/var/lib/microtensor-miner
user=microtensor
environment=MMC_ENV_FILE="/etc/microtensor-miner/miner.env",HOME="/var/lib/microtensor-miner",USER="microtensor",LOGNAME="microtensor",XDG_CACHE_HOME="/var/cache/microtensor-miner",TMPDIR="/var/lib/microtensor-miner/tmp",PYTHONSAFEPATH="1",PYTHONDONTWRITEBYTECODE="1"
umask=0077
# Keep this program stopped until the launch rehearsal passes; see launch_todo.md.
autostart=false
autorestart=unexpected
# Exit 3 is a persistent transaction-authorization stop that requires operator review.
# Exit 2 is a refusal that --once reports; the continuous `run` retries in process instead.
exitcodes=0,3
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/microtensor-miner/controller.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
