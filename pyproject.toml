[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microtensor-miner-controller"
version = "0.1.0"
description = "Fail-closed, round-aware supervision for a Microtensor subnet miner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "microtensor-subnet[provenance,s3] @ git+https://github.com/microtensor-io/microtensor-subnet.git@d0e002f887d038bf3ea4af65b499137a755620d7",
]

[project.optional-dependencies]
selfcheck = [
  "microtensor-subnet[validator,gguf] @ git+https://github.com/microtensor-io/microtensor-subnet.git@d0e002f887d038bf3ea4af65b499137a755620d7",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
microtensor-miner-controller = "microtensor_miner_controller.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S603"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["microtensor_miner_controller"]
